services:
  flagd:
    image: ghcr.io/open-feature/flagd:latest
    command: start --uri file:/etc/flagd/flags.json
    volumes:
      - ./flags:/etc/flagd:ro
    ports:
      - "8013:8013"
  app:
    build: .
    environment:
      FLAGD_HOST: flagd
    ports:
      - "3011:3001"   # 3001 déjà utilisé par mon portfolio (TP1)
    depends_on:
      - flagd
