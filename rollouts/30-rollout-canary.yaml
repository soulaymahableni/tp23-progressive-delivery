apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: demo
  namespace: tp23
spec:
  replicas: 10            # sans routeur de trafic : 1 Pod = 10 % du trafic
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: demo
  template:
    metadata:
      labels:
        app: demo
    spec:
      containers:
        - name: demo
          image: observability-demo:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3000
          env:
            - name: APP_VERSION
              value: v3          # version défaillante de la partie 4
            - name: ERROR_RATE
              value: "0.5"       # 50 % d'erreurs sur /api/orders
            - name: OTEL_SDK_DISABLED
              value: "true"
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { memory: 192Mi }
  strategy:
    canary:
      # Analyse Prometheus en arrière-plan, active dès le 2e pas (index 1)
      analysis:
        templates:
          - templateName: error-rate
        startingStep: 1
        args:
          - name: canary-hash
            valueFrom:
              podTemplateHashValue: Latest
      steps:
        - setWeight: 10
        - pause: { duration: 60s }
        - setWeight: 25
        - pause: { duration: 60s }
        - setWeight: 50
        - pause: { duration: 60s }
        - setWeight: 100
